name: verify-pack

# Task #659: none of the four shipped marketplace repos had any CI. The pack
# verifier existed but ran only when a human remembered, from a sibling path
# that exists solely in the maintainer's local layout -- so it was a check that
# could not fail anything on a clone. This is the moment at which it can.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify pack integrity
        run: node scripts/verify-pack.mjs .

      # Task #1013 RC-2: the host runs wordpress/dist/*.mjs, not the source.
      # 1.3.5 shipped new source with a stale bundle and nothing failed. This
      # rebuilds the bundles and fails when the committed dist/ differs.
      - name: WordPress dist is a fresh build of the source
        working-directory: wordpress
        run: npm ci --ignore-scripts && node scripts/check-dist-fresh.mjs

      # Rule #350 Spirit Gate: NOT run in CI, same as the three synced packs
      # (task #1002). It needs a token for, and a route into, the operator's
      # private o-MATIC Server, which a GitHub runner has no business reaching
      # (operator ruling 2026-09-30: nothing we ship looks for a private
      # server). It ran red on every push from 2026-09-30 and taught everyone
      # to ignore CI. The live gate is the LOCAL pre-release step:
      #   OMATIC_MCP_URL=... OMATIC_MCP_TOKEN=... node scripts/spirit-gate-check.mjs .
      # and its verdict is recorded in factory.spirit_gate_verdicts.

      # Blocking on purpose. No continue-on-error, no `|| true`: the placeholder
      # rule in verify-pack.mjs exists because a manifest that fails this check
      # ships a server that never starts, and the host reports that as "no
      # tools" rather than as an error. A warning would be indistinguishable
      # from the silence it is meant to break.
      - name: Verify MCP host config shapes
        run: node scripts/check-mcp-host-shapes.mjs .

      - name: Catalog versions match each plugin.json
        run: node scripts/check-catalog-versions.mjs .
